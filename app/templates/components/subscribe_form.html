<div class="subscribe-widget w-full">
    <form action="/events/subscribe" method="POST" class="subscribe-form flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
        <input type="email" name="email" required placeholder="Enter your email to get event updates..."
            class="subscribe-email flex-1 min-w-0 p-2 text-sm md:text-base bg-white text-gray-900 placeholder-gray-500 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-md font-medium" />
        <button type="submit"
            class="subscribe-btn shrink-0 min-w-[140px] bg-blue-400 hover:bg-blue-500 text-xs md:text-sm text-gray-900 justify-center font-semibold px-8 py-3 rounded-lg shadow-md hover:no-underline backdrop-blur-sm flex gap-2 items-center">
            <i class="fas fa-bell"></i>
            <span>Subscribe</span>
        </button>
    </form>
    <div class="subscribe-message hidden mt-3 p-3 rounded-xl text-xs md:text-sm font-bold text-center shadow-lg border border-white/20 transition-all duration-300"></div>
</div>

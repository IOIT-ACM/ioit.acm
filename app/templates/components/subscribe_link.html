<div class="subscribe-widget">
    <button type="button" class="subscribe-trigger text-blue-800 hover:text-blue-700 text-sm font-semibold inline-flex items-center gap-1.5 bg-transparent border-none cursor-pointer p-0">
        <i class="fas fa-bell"></i>
        <span>{{ label|default("Get notified about upcoming events") }}</span>
    </button>
    <div class="subscribe-form-container hidden mt-3 w-full sm:max-w-sm">
        <form action="/events/subscribe" method="POST" class="subscribe-form flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <input type="email" name="email" required placeholder="Enter your email..."
                class="subscribe-email flex-1 min-w-0 p-2 text-sm bg-white text-gray-900 placeholder-gray-500 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm font-medium" />
            <button type="submit"
                class="subscribe-btn shrink-0 bg-blue-400 hover:bg-blue-500 text-xs text-gray-900 justify-center font-semibold px-4 py-2 rounded-lg shadow-md flex gap-2 items-center">
                <i class="fas fa-paper-plane"></i>
                <span>Subscribe</span>
            </button>
        </form>
        <div class="subscribe-message hidden mt-2 p-2 rounded-lg text-xs font-bold text-center shadow-lg border border-white/20 transition-all duration-300"></div>
    </div>
</div>
